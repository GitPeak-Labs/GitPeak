<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="peek at any github profile explore stats, languages, repositories, and contribution history, beautifully."
    />

    <meta name="theme-color" content="#191724" />
    <meta name="color-scheme" content="dark light" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GitPeak" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link
      rel="preload"
      href="/fonts/dm-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:site_name" content="gitpeak" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "website",
        "name": "gitpeak",
        "url": "https://gitpeak.vercel.app/"
      }
    </script>

    <title>gitpeak</title>

    <script>
      try {
        const savedThemeName = localStorage.getItem('gitpeak-theme')

        if (savedThemeName === 'custom') {
          const rawThemeTokens = localStorage.getItem('gitpeak-theme-tokens')

          if (rawThemeTokens) {
            const parsedThemeTokens = JSON.parse(rawThemeTokens)
            const rootElement = document.documentElement

            for (const tokenKey in parsedThemeTokens) {
              rootElement.style.setProperty('--' + tokenKey, parsedThemeTokens[tokenKey])
            }
          }
        } else if (savedThemeName) {
          document.documentElement.setAttribute('data-theme', savedThemeName)
        }
      } catch (error) {
        console.warn('failed to restore gitpeak theme from local storage', error)
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
